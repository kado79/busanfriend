<!doctype html>
<!--
  부산 해안 걷기 코스 지도 — 카카오맵 (한국어 / 영어)
  데이터: courses.js (build.py 가 docs/courses/gpx/ 의 두루누비 GPX로 만든다)
  코스별 링크·영어 문구: courses-text.js / 카카오 JavaScript 키: kakao-key.js
  주소: .../map/            한국어
        .../map/?lang=en    영어
        .../map/#haeparang-1  (코스 링크 — 열면 그 코스가 바로 보인다)
        .../map/?min=15&max=25 (거리 조건 — 화면의 거리 칸에 입력해도 주소에 반영된다)
        .../map/?type=bike     자전거길 지도 (데이터: bike-courses.js, bike-text.js, GPX: ../gpx-bike/)
        .../map/?type=run      러닝 지도   ┐ 같은 데이터(run-courses.js, run-text.js, GPX: ../gpx-run/)를
        .../map/?type=trail    트레일런 지도 ┘ courses.json 의 trail(러닝/트레일런)로 나눠 보여 준다
  로컬: serve.cmd 실행 → http://localhost:8000/map/ (카카오맵은 등록한 주소에서만 열린다)
-->

<style>
  :root {
    --bg: #ffffff; --panel: #f7f5f1; --ink: #1d2731; --muted: #66727e; --line: #e2ddd4;
    --sel: #f2683c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 14px; }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  #map { height: 100%; position: relative; }
  #map .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); line-height: 1.6; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lang { font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .modes { display: flex; gap: 4px; padding: 4px; margin: 0 0 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .modes a { flex: 1; text-align: center; padding: 7px 4px; border-radius: 7px; font-size: 13px; font-weight: 600;
    color: var(--muted); text-decoration: none; white-space: nowrap; }
  .modes a:hover { background: var(--panel); color: var(--ink); }
  .modes a[aria-current="page"] { background: var(--sel); color: #fff; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; background: #fff; }
  legend { font-weight: 600; padding: 0 4px; }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
  .range { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .range input { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .count { color: var(--muted); margin-left: auto; }
  #detail { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; display: none; }
  #detail h2 { font-size: 16px; margin: 0 0 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .stat { background: var(--panel); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .desc { color: var(--ink); line-height: 1.5; margin: 8px 0; font-size: 13px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .links a, .links button { font-size: 13px; }
  .linkbtn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink); }
  .note { color: var(--muted); font-size: 12px; }
  svg.profile { width: 100%; height: 110px; display: block; margin-top: 6px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; border-radius: 8px; cursor: pointer; }
  ul.list li:hover { background: var(--panel); }
  aside > ul.list li:hover { background: #fff; }
  ul.list li.sel { background: #fff; outline: 2px solid var(--sel); }
  ul.list li .dot { margin-top: 4px; }
  ul.list .name { font-weight: 600; }
  ul.list .meta { color: var(--muted); font-size: 12px; }
  .list-title { font-size: 13px; color: var(--muted); margin: 6px 0 4px 8px; font-weight: 600; }
  .tag { font-size: 11px; background: #eee6da; color: #6b5a40; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .tag.rec { background: #fde4da; color: #b4421c; }
  .empty { color: var(--muted); padding: 10px; }
  footer { color: var(--muted); font-size: 11px; margin-top: 14px; line-height: 1.5; }
  .tip { background: rgba(29,39,49,.9); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(12px, -50%); pointer-events: none; }
  .pin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #map { height: 55vh; order: -1; }
    aside { border-right: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head">
      <h1 id="t-title"></h1>
      <a class="lang" id="lang-link" href="#"></a>
    </div>
    <nav class="modes" id="mode-links"></nav>
    <p class="sub" id="t-sub"></p>

    <div id="detail"></div>

    <fieldset id="trails"><legend id="t-trails"></legend></fieldset>

    <fieldset>
      <legend id="t-filters"></legend>
      <label><input type="checkbox" id="f-rec" checked> <span id="t-rec-only"></span></label>
      <div class="range"><span id="t-range"></span>
        <input type="number" id="f-min" min="0" step="1" inputmode="numeric" aria-label="min km"> ~
        <input type="number" id="f-max" min="0" step="1" inputmode="numeric" aria-label="max km"> km</div>
      <label id="row-coast"><input type="checkbox" id="f-coast"> <span id="t-coast"></span></label>
      <label><input type="checkbox" id="f-bike"> <span id="t-bike"></span></label>
      <label><input type="checkbox" id="f-terrain"> <span id="t-terrain"></span></label>
    </fieldset>

    <div class="list-title" id="t-all"></div>
    <ul class="list" id="list"></ul>

    <footer id="t-footer"></footer>
  </aside>
  <div id="map"></div>
</div>

<script>
// 지도 종류: 걷기(기본) / 자전거(?type=bike) / 러닝(?type=run) / 트레일런(?type=trail). 종류마다 데이터 파일이 다르다.
const MODE = { bike: "bike", run: "run", trail: "trail" }[new URLSearchParams(location.search).get("type")] || "walk";
({ walk: ["courses.js", "courses-text.js"], bike: ["bike-courses.js", "bike-text.js"],
   run: ["run-courses.js", "run-text.js"], trail: ["run-courses.js", "run-text.js"] })[MODE]
  .concat("kakao-key.js").forEach((f) => document.write(`<script src="${f}"><\/script>`));
</script>
<script>
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
// 러닝·트레일런은 같은 데이터를 나눠 보여 준다. 다른 쪽 코스 링크(예: ?type=run#cheonmasan)로 들어오면 그쪽 지도로 옮긴다.
if (MODE === "run" || MODE === "trail") {
  const kind = { run: "러닝", trail: "트레일런" }[MODE];
  const slug = decodeURIComponent(location.hash.slice(1));
  if (COURSES.some((c) => c.trail !== kind && (window.COURSE_TEXT[c.name] || {}).slug === slug)) {
    const q = new URLSearchParams(location.search);
    q.set("type", MODE === "run" ? "trail" : "run");
    location.replace(location.pathname + "?" + q + location.hash);
  }
  window.COURSES = COURSES.filter((c) => c.trail === kind);
}
const CFG = {
  walk: {
    colors: { "해파랑길": "#e4572e", "남파랑길": "#1d7fd1", "갈맷길": "#7b4fd6", "해안누리길": "#1aa66c" },
    // 호스트 추천 코스 (2026-11-02 사용자 지정, 이 순서대로 보여 준다)

      "해안누리길 해운대삼포길", "해안누리길 절영해안산책로", "해안누리길 기장 해안산책로", "갈맷길 4-1코스"],
    coastFilter: true, bikeLanes: false, gpxDir: "../gpx/",
  },
  bike: {
    colors: { "부산": "#1d7fd1", "낙동강 종주": "#e4572e", "부산 근교": "#7b4fd6" },
    recs: [], coastFilter: false, bikeLanes: true, gpxDir: "../gpx-bike/",
  },
  run: {
    colors: { "러닝": "#1d7fd1" },
    recs: [], coastFilter: false, bikeLanes: false, gpxDir: "../gpx-run/",
  },
  trail: {
    colors: { "트레일런": "#e4572e" },
    recs: [], coastFilter: false, bikeLanes: false, gpxDir: "../gpx-run/",

}[MODE];
const COLORS = CFG.colors;
const RECS = CFG.recs;
const COURSE1 = ["갈맷길 2-2코스", "갈맷길 2-1코스"];
const COURSE1_SLUG = "host-walk";

const T = {

    bikeTitle: "부산 자전거길 지도", bikeSub: "두루누비 공식 GPX · 부산과 근교 자전거길",

    fileMsg: "카카오맵은 파일로 직접 열면 표시되지 않는다.<br><b>serve.cmd</b> 를 실행한 뒤 <b>http://localhost:8000/map/</b> 으로 연다.",

      "부산": "Busan", "낙동강 종주": "Nakdong River (cross-country)", "부산 근교": "Near Busan",

    footer: `Distances are calculated from the GPS tracks (official distance in brackets).<br>

    dirNote: "Some GPS tracks are drawn in the opposite direction. Green = start and red = end of the track.",

const LEVEL_EN = { "쉬움": "Easy", "보통": "Moderate", "어려움": "Hard" };

const text = (c) => window.COURSE_TEXT[c.name] || {};
const slugOf = (c) => text(c).slug;
const nameOf = (c) => LANG === "en" ? (text(c).name || c.name) : c.name.replace("해안누리길 ", "");
const descOf = (c) => LANG === "en" ? (text(c).desc || "") : c.desc;
const levelOf = (c) => LANG === "en" ? (LEVEL_EN[c.level] || c.level || "") : (c.level || "");
const fmtTime = (m) => m ? T.time(m) : "—";
const isRec = (c) => RECS.includes(c.name);
const linkFor = (slug) => {
  const q = new URLSearchParams();
  if (MODE !== "walk") q.set("type", MODE);
  if (LANG === "en") q.set("lang", "en");
  return location.origin + location.pathname + (q.toString() ? "?" + q : "") + "#" + slug;
};

// 화면 글자
const TITLE = { walk: T.title, bike: T.bikeTitle, run: T.runTitle, trail: T.trailTitle }[MODE];
document.documentElement.lang = LANG;
document.title = TITLE;
const setText = (id, v, html) => { const el = document.getElementById(id); html ? (el.innerHTML = v) : (el.textContent = v); };
[["t-title", TITLE], ["t-sub", { walk: T.sub, bike: T.bikeSub, run: T.runSub, trail: T.trailSub }[MODE]], ["t-trails", T.trails], ["t-filters", T.filters],
 ["t-rec-only", T.recOnly], ["t-range", T.range], ["t-coast", T.coast], ["t-bike", T.bikeLanes], ["t-terrain", T.terrain],
 ["t-all", T.all]].forEach(([id, v]) => setText(id, v));
setText("t-footer", T.footer, true);
// 종류에 없는 칸은 숨긴다
if (!RECS.length) document.getElementById("f-rec").closest("label").style.display = "none";
if (!CFG.coastFilter) document.getElementById("row-coast").style.display = "none";
// 지도 종류 버튼 3개 (지금 보고 있는 종류는 눌린 모양, 언어는 유지)
Object.entries(T.modes).forEach(([m, label]) => {
  const mq = new URLSearchParams();
  if (m !== "walk") mq.set("type", m);
  if (LANG === "en") mq.set("lang", "en");
  const a = document.createElement("a");
  a.href = location.pathname + (mq.toString() ? "?" + mq : "");
  a.textContent = label;
  if (m === MODE) a.setAttribute("aria-current", "page");
  document.getElementById("mode-links").appendChild(a);
});
const langLink = document.getElementById("lang-link");
const updateLangLink = () => {
  const q = new URLSearchParams(location.search);
  LANG === "en" ? q.delete("lang") : q.set("lang", "en");
  langLink.href = location.pathname + (q.toString() ? "?" + q : "") + location.hash;
};
langLink.textContent = T.lang;
updateLangLink();

const mapBox = document.getElementById("map");
function showMsg(html) { mapBox.innerHTML = `<div class="msg">${html}</div>`; }

if (location.protocol === "file:") {
  showMsg(T.fileMsg);
} else if (!window.KAKAO_JS_KEY) {
  showMsg(T.keyMsg);
} else {
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${window.KAKAO_JS_KEY}&autoload=false`;
  s.onload = () => kakao.maps.load(init);
  s.onerror = () => showMsg(T.loadMsg);
  document.head.appendChild(s);
}

function init() {
  const K = kakao.maps;
  const LL = (p) => new K.LatLng(p[0], p[1]);
  // 기본은 스카이뷰(위성 + 지명). 오른쪽 위 버튼으로 일반 지도로 바꿀 수 있다.
  const map = new K.Map(mapBox, { center: new K.LatLng(35.13, 129.05), level: 9, mapTypeId: K.MapTypeId.HYBRID });
  map.addControl(new K.MapTypeControl(), K.ControlPosition.TOPRIGHT);
  map.addControl(new K.ZoomControl(), K.ControlPosition.RIGHT);

  // 거리 조건: 주소 파라미터 ?min=15&max=25 로도 받는다 (빈칸 = 제한 없음)
  const numParam = (k) => { const v = parseFloat(new URLSearchParams(location.search).get(k)); return Number.isFinite(v) ? v : null; };
  const state = { trails: new Set(Object.keys(COLORS)), recOnly: RECS.length > 0, min: numParam("min"), max: numParam("max"), coast: false, selected: new Set(), course1: false };
  const lines = {};
  const halos = {}; // 위성 사진 위에서도 선이 보이도록 코스 선 아래에 까는 흰 테두리
  let pins = [];
  let lineClickedAt = 0;

  const tip = new K.CustomOverlay({ content: '<div class="tip"></div>', xAnchor: 0, yAnchor: 0.5, zIndex: 10 });

  COURSES.forEach((c) => {
    const path = c.line.map(LL);
    halos[c.name] = new K.Polyline({ path, strokeWeight: 8, strokeColor: "#ffffff", strokeOpacity: 0.75, strokeStyle: "solid" });
    const pl = new K.Polyline({ path, strokeWeight: 4, strokeColor: COLORS[c.trail], strokeOpacity: 0.9, strokeStyle: "solid" });
    K.event.addListener(pl, "click", () => { lineClickedAt = Date.now(); select([c.name]); });
    K.event.addListener(pl, "mouseover", (e) => {
      tip.setContent(`<div class="tip">${nameOf(c)} · ${c.gpxKm}km</div>`);
      tip.setPosition(e.latLng); tip.setMap(map);
    });
    K.event.addListener(pl, "mousemove", (e) => tip.setPosition(e.latLng));
    K.event.addListener(pl, "mouseout", () => tip.setMap(null));
    lines[c.name] = pl;
  });

  function passes(c) {
    if (state.recOnly && !isRec(c)) return false;
    if (state.min != null && c.gpxKm < state.min) return false;
    if (state.max != null && c.gpxKm > state.max) return false;
    if (state.coast && c.kind !== "coast") return false;
    return true;
  }
  const visible = (c) => state.trails.has(c.trail) && passes(c);

  function item(c) {
    const li = document.createElement("li");
    if (state.selected.has(c.name) && !state.course1) li.className = "sel";
    li.innerHTML = `<span class="dot" style="background:${COLORS[c.trail]}"></span>
      <div><div class="name">${nameOf(c)}${isRec(c) ? `<span class="tag rec">${T.rec}</span>` : ""}${c.kind === "mixed" ? `<span class="tag">${T.mixed}</span>` : ""}</div>
      <div class="meta">${c.gpxKm}km (${c.officialKm ?? "—"}) · ${fmtTime(c.minutes)} · ${T.climbShort} ${c.gainM ?? "—"}m · ${levelOf(c)}</div></div>`;
    li.onclick = () => select([c.name]);
    return li;
  }

  function render() {
    const shown = COURSES.filter(visible);
    COURSES.forEach((c) => {
      const pl = lines[c.name], halo = halos[c.name];
      const sel = state.selected.has(c.name);
      const on = shown.includes(c) || sel;
      pl.setMap(on ? map : null);
      halo.setMap(on ? map : null);
      const dim = state.selected.size > 0 && !sel;
      pl.setOptions({ strokeWeight: sel ? 7 : 4, strokeOpacity: dim ? 0.3 : 0.9 });
      halo.setOptions({ strokeWeight: sel ? 12 : 8, strokeOpacity: dim ? 0.2 : 0.75 });
      pl.setZIndex(sel ? 5 : 1);
      halo.setZIndex(sel ? 4 : 0);
    });

    pins.forEach((p) => p.setMap(null));
    pins = [];
    state.selected.forEach((n) => {
      const c = COURSES.find((x) => x.name === n);
      [[c.line[0], "#16a34a"], [c.line[c.line.length - 1], "#dc2626"]].forEach(([p, col]) => {
        const o = new K.CustomOverlay({ position: LL(p), content: `<div class="pin" style="background:${col}"></div>`, xAnchor: 0.5, yAnchor: 0.5, zIndex: 6 });
        o.setMap(map); pins.push(o);
      });
    });

    // 전체 코스 목록: 추천 코스를 RECS 순서대로 먼저, 나머지는 그 뒤에
    const rank = (c) => isRec(c) ? RECS.indexOf(c.name) : RECS.length + COURSES.indexOf(c);
    const list = document.getElementById("list");
    list.innerHTML = shown.length ? "" : `<li class="empty">${T.empty}</li>`;
    [...shown].sort((a, b) => rank(a) - rank(b)).forEach((c) => list.appendChild(item(c)));

    document.querySelectorAll("#trails .count").forEach((el) => {
      el.textContent = COURSES.filter((c) => c.trail === el.dataset.trail && passes(c)).length;
    });
    renderDetail();
  }

  function fit(courses) {
    const b = new K.LatLngBounds();
    courses.forEach((c) => c.line.forEach((p) => b.extend(LL(p))));
    map.setBounds(b, 40, 40, 40, 40);
  }

  function setHash(slug) {
    history.replaceState(null, "", location.pathname + location.search + (slug ? "#" + slug : ""));
    updateLangLink();
  }

  function select(names, fromCourse1 = false) {
    state.course1 = fromCourse1;
    state.selected = new Set(names);
    fit(names.map((n) => COURSES.find((c) => c.name === n)));
    setHash(fromCourse1 ? COURSE1_SLUG : slugOf(COURSES.find((c) => c.name === names[0])));
    render();
    if (window.innerWidth <= 760) mapBox.scrollIntoView({ behavior: "smooth" });
  }

  function clearSel() {
    state.selected.clear(); state.course1 = false; setHash(""); render();
  }

  function profileSvg(profile) {
    if (!profile || profile.length < 2) return "";
    const W = 340, H = 100, P = 22;
    const maxX = profile[profile.length - 1][0];
    const ys = profile.map((p) => p[1]);
    const minY = Math.min(...ys), maxY = Math.max(...ys, minY + 10);
    const x = (d) => P + (d / maxX) * (W - P - 4);
    const y = (e) => H - 16 - ((e - minY) / (maxY - minY)) * (H - 26);
    const pts = profile.map((p) => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
    const area = `${x(0)},${H - 16} ${pts} ${x(maxX)},${H - 16}`;
    return `<svg class="profile" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="elevation">
      <polygon points="${area}" fill="rgba(242,104,60,.18)"/>
      <polyline points="${pts}" fill="none" stroke="#f2683c" stroke-width="1.6"/>
      <text x="2" y="${y(maxY) + 4}" font-size="9" fill="#66727e">${Math.round(maxY)}m</text>
      <text x="2" y="${H - 16}" font-size="9" fill="#66727e">${Math.round(minY)}m</text>
      <text x="${P}" y="${H - 3}" font-size="9" fill="#66727e">0km</text>
      <text x="${W - 4}" y="${H - 3}" font-size="9" fill="#66727e" text-anchor="end">${maxX.toFixed(1)}km</text>
    </svg>`;
  }

  const copyBtn = (slug) => `<button class="linkbtn" data-slug="${slug}">${T.copy}</button>`;

  function renderDetail() {
    const box = document.getElementById("detail");
    if (state.selected.size === 0) { box.style.display = "none"; return; }
    box.style.display = "block";
    const cs = [...state.selected].map((n) => COURSES.find((c) => c.name === n));
    if (state.course1) {
      const km = cs.reduce((s, c) => s + c.gpxKm, 0).toFixed(1);
      const gain = cs.reduce((s, c) => s + (c.gainM || 0), 0);
      box.innerHTML = `<h2>${T.c1Title}</h2>
        <div class="stats">
          <div class="stat"><b>${km}km</b><span>${T.c1Sum}</span></div>
          <div class="stat"><b>18km</b><span>${T.c1Real}</span></div>
          <div class="stat"><b>${gain}m</b><span>${T.climb}</span></div>
        </div>
        <p class="desc">${T.c1Desc}</p>
        <p class="note">${T.dirNote}</p>
        <div class="links">${copyBtn(COURSE1_SLUG)}</div>`;
    } else {
      const c = cs[0];
      const addr = LANG === "ko" && (c.start || c.end) ? `<p class="desc">${T.start}: ${c.start || "—"}<br>${T.end}: ${c.end || "—"}</p>` : "";
      box.innerHTML = `<h2>${nameOf(c)}${isRec(c) ? `<span class="tag rec">${T.rec}</span>` : ""}${c.kind === "mixed" ? `<span class="tag">${T.mixed}</span>` : ""}</h2>
        <div class="note">${T.trailName(c.trail)} · ${T.level} ${levelOf(c) || "—"}</div>
        <div class="stats">
          <div class="stat"><b>${c.gpxKm}km</b><span>${T.official} ${c.officialKm != null ? c.officialKm + "km" : "—"}</span></div>
          <div class="stat"><b>${fmtTime(c.minutes)}</b><span>${T.officialTime}</span></div>
          <div class="stat"><b>${c.gainM ?? "—"}m</b><span>${T.climb}</span></div>
        </div>
        ${profileSvg(c.profile)}
        <div class="note">${T.eleSrc}: ${c.eleSource === "GPX" ? T.eleGpx : T.eleDem}${c.maxEle != null ? " · " + T.maxEle + " " + c.maxEle + "m" : ""}</div>
        ${addr}
        <p class="desc">${descOf(c)}</p>
        <div class="links"><a href="${c.durunubi}" target="_blank" rel="noopener">${T.durunubi}</a><a href="${CFG.gpxDir}${encodeURIComponent(c.gpx)}" download>${T.gpx}</a>${slugOf(c) ? copyBtn(slugOf(c)) : ""}</div>`;
    }
    box.querySelectorAll(".linkbtn").forEach((b) => b.onclick = async () => {
      try { await navigator.clipboard.writeText(linkFor(b.dataset.slug)); b.textContent = T.copied; }
      catch { prompt(T.copy, linkFor(b.dataset.slug)); }
    });
  }

  const fs = document.getElementById("trails");
  Object.entries(COLORS).forEach(([t, col]) => {
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${col}"></span>${T.trailName(t)}<span class="count" data-trail="${t}"></span>`;
    lab.querySelector("input").onchange = (e) => { e.target.checked ? state.trails.add(t) : state.trails.delete(t); render(); };
    fs.appendChild(lab);
  });
  document.getElementById("f-rec").onchange = (e) => { state.recOnly = e.target.checked; render(); };
  const fMin = document.getElementById("f-min"), fMax = document.getElementById("f-max");
  if (state.min != null) fMin.value = state.min;
  if (state.max != null) fMax.value = state.max;
  const onRange = () => {
    const num = (el) => el.value === "" ? null : parseFloat(el.value);
    state.min = num(fMin); state.max = num(fMax);
    const q = new URLSearchParams(location.search);
    state.min != null ? q.set("min", state.min) : q.delete("min");
    state.max != null ? q.set("max", state.max) : q.delete("max");
    history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash);
    updateLangLink();
    render();
  };
  fMin.oninput = onRange; fMax.oninput = onRange;
  document.getElementById("f-coast").onchange = (e) => { state.coast = e.target.checked; render(); };
  const fBike = document.getElementById("f-bike");
  const setBikeLanes = (on) => on ? map.addOverlayMapTypeId(K.MapTypeId.BICYCLE) : map.removeOverlayMapTypeId(K.MapTypeId.BICYCLE);
  fBike.checked = CFG.bikeLanes;
  setBikeLanes(fBike.checked);
  fBike.onchange = (e) => setBikeLanes(e.target.checked);
  document.getElementById("f-terrain").onchange = (e) => {
    e.target.checked ? map.addOverlayMapTypeId(K.MapTypeId.TERRAIN) : map.removeOverlayMapTypeId(K.MapTypeId.TERRAIN);
  };
  K.event.addListener(map, "click", () => {
    if (Date.now() - lineClickedAt < 300) return;
    if (state.selected.size) clearSel();
  });

  function openFromHash() {
    const slug = decodeURIComponent(location.hash.slice(1));
    if (!slug) return false;
    if (slug === COURSE1_SLUG) { select(COURSE1, true); return true; }
    const c = COURSES.find((x) => slugOf(x) === slug);
    if (c) { select([c.name]); return true; }
    return false;
  }
  window.addEventListener("hashchange", openFromHash);

  window.__courseMap = { map, select, state };
  render();
  if (!openFromHash()) fit(COURSES.filter(visible));
}
</script>
</body>
</html>
